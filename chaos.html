<!DOCTYPE html>
<html>

<head>

    <title>Chaos Mission</title>
<link rel="stylesheet" href="style.css">

    <style>

        body {
            background-color: black;
            color: white;
            text-align: center;
        }

        h1 {
            color: red;
            margin-top: 100px;
        }

        .mission {
            margin-top: 50px;
            padding: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 10px;
            background-color: darkred;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: red;
        }

    </style>

</head>

<body>

    <h1>🌀 CHAOS MISSION</h1>

    <div class="mission">

        <h2 id="question">
            Speak like a robot for 30 seconds!
        </h2>

        <br>

        <button onclick="nextMission()">
            NEXT MISSION
        </button>

        <br>

        <button onclick="goBack()">
            BACK
        </button>

    </div>


    <script>

        let missions = [

            "Speak like a robot for 30 seconds!",

            "Walk like a penguin for 20 seconds!",

            "Make your funniest sound!",

            "Pretend the floor is lava!",

            "Say your name in the most dramatic way possible!",

            "Act like you just won a huge award!",

            "Talk without using the letter A for 30 seconds!",

            "Pretend you are a detective investigating a missing pencil!",

            "Freeze like a statue for 15 seconds!",

            "Create a completely ridiculous dance move!"

        ];

        let number = 0;


        function nextMission() {

            number = number + 1;

            if (number < missions.length) {

                document.getElementById("question").innerHTML =
                    missions[number];

            } else {

                document.getElementById("question").innerHTML =
                    "🌀 CHAOS COMPLETE! You survived!";

            }

        }


        function goBack() {

            window.location.href = "mood.html";

        }

    </script>

</body>

</html>
